[package]
name = "clack"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/meck/clack"
publish = false
description = "Command-line client for the clack SCPI relay firmware on the Waveshare Pico-Relay-B"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
relay-scpi = { path = "../relay-scpi" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serialport = "4.10.1"
toml = "1.2.1"

[dev-dependencies]
heapless = "0.9.1"

# The same strict lints as relay-scpi. The client must not panic on bad
# input from the user, the config file or the board.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
arithmetic_side_effects = "warn"
indexing_slicing = "warn"
string_slice = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[lints.rust]
unsafe_code = "forbid"
